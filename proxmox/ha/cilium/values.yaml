# Cilium の helm values（Talos 向け）
# インストール手順とチャートのバージョンは README.md を参照

ipam:
  mode: kubernetes

# kube-proxy を無効にしているので、Service の処理は Cilium が行う
kubeProxyReplacement: true

# kube-proxy がない状態で API server に届くよう、Talos の KubePrism を使う
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos はカーネルモジュールのロードを許可しないため SYS_MODULE を外す
# helm はリストを丸ごと置き換えるので、チャートのデフォルトから SYS_MODULE だけを除いた一覧を書いている。
# チャートを更新するときは `helm show values cilium/cilium --version <新バージョン>` のデフォルトと比べ直す
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYSLOG
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Talos は cgroupv2 を /sys/fs/cgroup にマウント済み
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
